{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search - Waypoint</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <h1>Search Trails</h1>

    <form method="GET">
        <input type="text" name="q" value="{{ query }}" placeholder="Search trails...">
        <button type="submit">Search</button>
    </form>

    {% if query %}
        <p>You searched for: <strong>{{ query }}</strong></p>
    {% else %}
        <p>No search query yet.</p>
    {% endif %}
</body>
</html>
