{% extends "base.html" %}

{% block title %}Search - Waypoint{% endblock %}

{% block content %}
    <h1>Search Trails</h1>

    <form method="GET">
        <input type="text" name="q" value="{{ query }}" placeholder="Search trails...">
        <button type="submit">Search</button>
    </form>

    {% if query %}
        <p>You searched for: <strong>{{ query }}</strong></p>
    {% else %}
        <p>No search query yet.</p>
    {% endif %}
{% endblock %}
